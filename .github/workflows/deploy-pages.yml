name: Deploy website

on:
  push:
    branches: ["main"]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shiroa
        run: |
          curl -LsSf https://github.com/Myriad-Dreamin/shiroa/releases/download/v0.4.0-rc2/shiroa-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1
          sudo mv shiroa /usr/local/bin/

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          curl -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/crimsontext/CrimsonText-Regular.ttf \
            -o assets/fonts/CrimsonText-Regular.ttf
          curl -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf \
            -o assets/fonts/EBGaramond.ttf
          curl -fLsS https://raw.githubusercontent.com/stipub/stixfonts/v2.13b171/fonts/static_otf/STIXTwoMath-Regular.otf \
            -o assets/fonts/STIXTwoMath-Regular.otf

      - name: Build website
        run: shiroa build -d dist --font-path assets/fonts --path-to-root /

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
