name: Typst Compile Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pdf:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/typst/typst:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that main.typ compiles
        run: typst compile main.typ

  shiroa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shiroa
        run: |
          curl -LsSf https://github.com/Myriad-Dreamin/shiroa/releases/download/v0.4.0-rc2/shiroa-x86_64-unknown-linux-gnu.tar.gz | tar xz --strip-components=1
          sudo mv shiroa /usr/local/bin/

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          curl -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/crimsontext/CrimsonText-Regular.ttf \
            -o assets/fonts/CrimsonText-Regular.ttf
          curl -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf \
            -o assets/fonts/EBGaramond.ttf
          curl -fLsS https://raw.githubusercontent.com/stipub/stixfonts/v2.13b171/fonts/static_otf/STIXTwoMath-Regular.otf \
            -o assets/fonts/STIXTwoMath-Regular.otf

      - name: Build static HTML
        run: shiroa build -d dist --font-path assets/fonts --path-to-root /
